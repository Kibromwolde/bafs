<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethio-Global Logistics Operations Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function LogisticsOperationsPortal() {
      const [activeTab, setActiveTab] = useState('customs');
      const [searchTerm, setSearchTerm] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);

      // --- 1. CUSTOMS OPERATIONS DATA ---
      const [customsOps, setCustomsOps] = useState([
        { id: 'CUST-2026-001', declarationNo: 'DEC-88201', port: 'Galafi Border Post', declarant: 'Abebe Logistics', status: 'Customs Cleared', taxPaid: '145,000 ETB', dutyStatus: 'Paid', date: '2026-09-24' },
        { id: 'CUST-2026-002', declarationNo: 'DEC-88205', port: 'Mojo Dry Port', declarant: 'Ethio-Transit Agent', status: 'Physical Inspection', taxPaid: '320,000 ETB', dutyStatus: 'Pending', date: '2026-09-25' },
        { id: 'CUST-2026-003', declarationNo: 'DEC-88210', port: 'Dewele Checkpoint', declarant: 'Red Sea Cargo', status: 'Under Document Verification', taxPaid: '88,500 ETB', dutyStatus: 'In Review', date: '2026-09-25' }
      ]);

      // --- 2. TRAIN / ETHIO-DJIBOUTI RAILWAY DATA ---
      const [trainOps, setTrainOps] = useState([
        { id: 'EDR-TR-102', trainNo: 'Freight Train #04', origin: 'Nagad Station (Djibouti)', destination: 'Indode Freight Station', wagons: 42, cargoType: 'Containerized Goods', status: 'En Route', departure: '2026-09-25 06:00', eta: '2026-09-25 22:00' },
        { id: 'EDR-TR-105', trainNo: 'Freight Train #09', origin: 'Indode Freight Station', destination: 'Dire Dawa Station', wagons: 30, cargoType: 'Bulk Grain / Wheat', status: 'Loading', departure: '2026-09-26 04:00', eta: '2026-09-26 15:00' }
      ]);

      // --- 3. TRUCK TRANSPORT DATA ---
      const [truckOps, setTruckOps] = useState([
        { id: 'TRK-901', driver: 'Mulugeta Tesfaye', plate: '3-ET-34211', route: 'Port of Djibouti ➔ Mojo Dry Port', checkpoint: 'Awash Checkpoint', speed: '58 km/h', fuelLevel: '78%', cargoWeight: '32 Tons', status: 'In Transit' },
        { id: 'TRK-902', driver: 'Sintayehu Haile', plate: '3-ET-99012', route: 'Semera ➔ Kaliti Terminal', checkpoint: 'Metehara Station', speed: '0 km/h (Rest)', fuelLevel: '45%', cargoWeight: '28 Tons', status: 'Driver Rest' }
      ]);

      // --- 4. CARGO & DRY PORT HANDLING DATA ---
      const [cargoOps, setCargoOps] = useState([
        { id: 'CRG-501', containerNo: 'MSKU-9982310', size: '40ft HC', cargoDescription: 'Industrial Machinery', warehouse: 'Mojo Yard B', dischargeStatus: 'Discharged from Train', consignee: 'Midroc Industrial' },
        { id: 'CRG-502', containerNo: 'TGHU-1120498', size: '20ft Standard', cargoDescription: 'Pharmaceutical Supplies', warehouse: 'Kality Cold Storage', dischargeStatus: 'Stored in Warehouse', consignee: 'Ministry of Health' }
      ]);

      // --- 5. BAFS BULK SETTLEMENT DATA ---
      const [bulkPayments] = useState([
        { creditAccount: '1000010277427', amount: 10550.00, recipient: 'Customs Transit Permit Clearance' },
        { creditAccount: '1000010277427', amount: 11545.69, recipient: 'Ethio-Djibouti Railway Freight Fee' },
        { creditAccount: '1000010277427', amount: 45500.18, recipient: 'Heavy Truck Driver Per-Diem & Fuel' },
        { creditAccount: '1000591321707', amount: 11000.00, recipient: 'Mojo Dry Port Offloading Charges' }
      ]);

      // Form state for adding new operation logs
      const [newCustoms, setNewCustoms] = useState({ declarationNo: '', port: 'Mojo Dry Port', declarant: '', taxPaid: '', status: 'In Review' });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, customsOps, trainOps, truckOps, cargoOps, isModalOpen]);

      const handleAddCustoms = (e) => {
        e.preventDefault();
        const entry = {
          id: `CUST-2026-00${customsOps.length + 1}`,
          declarationNo: newCustoms.declarationNo || 'DEC-NEW',
          port: newCustoms.port,
          declarant: newCustoms.declarant || 'General Agent',
          status: newCustoms.status,
          taxPaid: newCustoms.taxPaid ? `${newCustoms.taxPaid} ETB` : '0 ETB',
          dutyStatus: 'Pending Verification',
          date: new Date().toISOString().split('T')[0]
        };
        setCustomsOps([entry, ...customsOps]);
        setIsModalOpen(false);
        setNewCustoms({ declarationNo: '', port: 'Mojo Dry Port', declarant: '', taxPaid: '', status: 'In Review' });
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans flex flex-col">
          {/* Main Navigation Header */}
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-600/30">
                <i data-lucide="layers" class="h-6 w-6 text-white"></i>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-wide">Ethiopian Multimodal Logistics Portal</h1>
                <p className="text-xs text-slate-400">Customs • Train Freight • Truck Operations • Dry Port & Cargo Management</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button 
                onClick={() => setIsModalOpen(true)}
                className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition shadow-lg shadow-emerald-600/20"
              >
                <i data-lucide="plus-circle" class="h-4 w-4"></i>
                <span>Log New Operation</span>
              </button>
            </div>
          </header>

          <div className="flex-1 flex flex-col md:flex-row">
            {/* Sidebar Navigation */}
            <aside className="w-full md:w-64 bg-slate-800/50 border-r border-slate-700 p-4 space-y-2">
              <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Operations Modules</p>
              
              <button 
                onClick={() => setActiveTab('customs')}
                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'customs' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <i data-lucide="shield-check" class="h-4 w-4"></i>
                <span>Customs & Clearance</span>
              </button>

              <button 
                onClick={() => setActiveTab('train')}
                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'train' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <i data-lucide="train" class="h-4 w-4"></i>
                <span>Train / Railway (EDR)</span>
              </button>

              <button 
                onClick={() => setActiveTab('truck')}
                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'truck' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <i data-lucide="truck" class="h-4 w-4"></i>
                <span>Truck Fleet Operations</span>
              </button>

              <button 
                onClick={() => setActiveTab('cargo')}
                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'cargo' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <i data-lucide="package" class="h-4 w-4"></i>
                <span>Cargo & Dry Port Handling</span>
              </button>

              <button 
                onClick={() => setActiveTab('finance')}
                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'finance' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <i data-lucide="credit-card" class="h-4 w-4"></i>
                <span>BAFS Settlement Sheets</span>
              </button>
            </aside>

            {/* Content Area */}
            <main className="flex-1 p-6 space-y-6 overflow-y-auto">

              {/* MODULE 1: CUSTOMS OPERATIONS */}
              {activeTab === 'customs' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <div>
                      <h2 className="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="shield-check" class="text-blue-400 h-5 w-5"></i>
                        Customs Declaration & Transit Clearances
                      </h2>
                      <p className="text-xs text-slate-400">Tracking customs entries at Galafi, Dewele, Mojo, and Kaliti checkpoints.</p>
                    </div>
                  </div>

                  <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900/60 text-slate-400 uppercase text-xs">
                        <tr>
                          <th className="p-3">Ref ID</th>
                          <th className="p-3">Declaration #</th>
                          <th className="p-3">Customs Port</th>
                          <th className="p-3">Declarant Agent</th>
                          <th className="p-3">Tax / Duty Amount</th>
                          <th className="p-3">Clearance Status</th>
                          <th className="p-3">Date</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700 font-mono">
                        {customsOps.map(item => (
                          <tr key={item.id} className="hover:bg-slate-700/30 transition">
                            <td className="p-3 text-blue-400">{item.id}</td>
                            <td className="p-3 font-semibold text-white">{item.declarationNo}</td>
                            <td className="p-3 font-sans text-slate-300">{item.port}</td>
                            <td className="p-3 font-sans text-slate-300">{item.declarant}</td>
                            <td className="p-3 text-emerald-400 font-semibold">{item.taxPaid}</td>
                            <td className="p-3 font-sans">
                              <span className="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                {item.status}
                              </span>
                            </td>
                            <td className="p-3 text-xs text-slate-400">{item.date}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* MODULE 2: TRAIN TRANSPORT */}
              {activeTab === 'train' && (
                <div className="space-y-6">
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="train" class="text-blue-400 h-5 w-5"></i>
                      Ethio-Djibouti Railway (EDR) Freight Operations
                    </h2>
                    <p className="text-xs text-slate-400">Train schedules, wagon counts, and terminal departures between Nagad and Indode.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {trainOps.map(train => (
                      <div key={train.id} className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-mono text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded">{train.id}</span>
                          <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            {train.status}
                          </span>
                        </div>
                        <h3 className="text-base font-bold text-white">{train.trainNo}</h3>
                        <p className="text-xs text-slate-300 font-medium">Route: {train.origin} ➔ {train.destination}</p>
                        <div className="grid grid-cols-2 gap-2 text-xs text-slate-400 bg-slate-900/50 p-3 rounded-lg font-mono">
                          <div>Wagons Attached: <span className="text-white">{train.wagons} Units</span></div>
                          <div>Cargo Type: <span className="text-white">{train.cargoType}</span></div>
                          <div>Departure: <span className="text-white">{train.departure}</span></div>
                          <div>Estimated Arrival: <span className="text-white">{train.eta}</span></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* MODULE 3: TRUCK TRANSPORT */}
              {activeTab === 'truck' && (
                <div className="space-y-6">
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="truck" class="text-blue-400 h-5 w-5"></i>
                      Heavy Truck Dispatch & Driver Telematics
                    </h2>
                    <p className="text-xs text-slate-400">Road transportation tracking along Ethiopian highway corridors.</p>
                  </div>

                  <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900/60 text-slate-400 uppercase text-xs">
                        <tr>
                          <th className="p-3">Truck ID</th>
                          <th className="p-3">Driver Name / Plate</th>
                          <th className="p-3">Corridor Route</th>
                          <th className="p-3">Live Location</th>
                          <th className="p-3">Cargo Load</th>
                          <th className="p-3">Fuel Status</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700">
                        {truckOps.map(trk => (
                          <tr key={trk.id} className="hover:bg-slate-700/30 transition">
                            <td className="p-3 font-mono text-blue-400">{trk.id}</td>
                            <td className="p-3">
                              <div className="font-semibold text-white">{trk.driver}</div>
                              <div className="text-xs font-mono text-slate-400">{trk.plate}</div>
                            </td>
                            <td className="p-3 text-xs">{trk.route}</td>
                            <td className="p-3 text-amber-300 font-medium">{trk.checkpoint}</td>
                            <td className="p-3 font-mono">{trk.cargoWeight}</td>
                            <td className="p-3 font-mono text-emerald-400">{trk.fuelLevel}</td>
                            <td className="p-3">
                              <span className="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                {trk.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* MODULE 4: CARGO & DRY PORT HANDLING */}
              {activeTab === 'cargo' && (
                <div className="space-y-6">
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="package" class="text-blue-400 h-5 w-5"></i>
                      Container Cargo & Dry Port Storage Operations
                    </h2>
                    <p className="text-xs text-slate-400">Inventory tracking at Mojo, Gelan, and Kombolcha Dry Ports.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {cargoOps.map(crg => (
                      <div key={crg.id} className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-2">
                        <div className="flex justify-between items-center font-mono">
                          <span className="text-blue-400 text-sm font-bold">{crg.containerNo} ({crg.size})</span>
                          <span className="text-xs text-slate-400">{crg.id}</span>
                        </div>
                        <h3 className="text-base font-semibold text-white">{crg.cargoDescription}</h3>
                        <div className="text-xs text-slate-300 space-y-1 bg-slate-900/50 p-3 rounded-lg">
                          <div>Warehouse / Yard Location: <span className="text-amber-300 font-medium">{crg.warehouse}</span></div>
                          <div>Handling Status: <span className="text-emerald-400 font-medium">{crg.dischargeStatus}</span></div>
                          <div>Consignee: <span className="text-white font-medium">{crg.consignee}</span></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* MODULE 5: BAFS FINANCIAL SETTLEMENT */}
              {activeTab === 'finance' && (
                <div className="space-y-6">
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="credit-card" class="text-emerald-400 h-5 w-5"></i>
                      BAFS Operational Cost Settlements
                    </h2>
                    <p className="text-xs text-slate-400">Operational payouts for customs fees, train freight, truck drivers, and dry port handling.</p>
                  </div>

                  <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900/60 text-slate-400 uppercase text-xs">
                        <tr>
                          <th className="p-3">#</th>
                          <th className="p-3">Credit Account (CBE / Bank)</th>
                          <th className="p-3">Operational Disbursement Purpose</th>
                          <th className="p-3 text-right">Amount (ETB)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700 font-mono">
                        {bulkPayments.map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-700/30 transition">
                            <td className="p-3 text-slate-500">{idx + 1}</td>
                            <td className="p-3 text-blue-300">{item.creditAccount}</td>
                            <td className="p-3 font-sans text-slate-200">{item.recipient}</td>
                            <td className="p-3 text-right font-semibold text-emerald-400">
                              {item.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} ETB
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODAL TO ADD NEW LOG ENTRY */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-white">Log Customs Clearance Operation</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAddCustoms} className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Declaration Number</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. DEC-99012"
                      value={newCustoms.declarationNo}
                      onChange={e => setNewCustoms({...newCustoms, declarationNo: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Customs Port / Checkpoint</label>
                    <select 
                      value={newCustoms.port}
                      onChange={e => setNewCustoms({...newCustoms, port: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-white"
                    >
                      <option value="Mojo Dry Port">Mojo Dry Port</option>
                      <option value="Galafi Border Post">Galafi Border Post</option>
                      <option value="Dewele Border Post">Dewele Border Post</option>
                      <option value="Kaliti Terminal">Kaliti Terminal</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Declarant / Agent Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Ethiopian Shipping Line Agent"
                      value={newCustoms.declarant}
                      onChange={e => setNewCustoms({...newCustoms, declarant: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Tax / Duty Amount (ETB)</label>
                    <input 
                      type="number" 
                      placeholder="e.g. 50000"
                      value={newCustoms.taxPaid}
                      onChange={e => setNewCustoms({...newCustoms, taxPaid: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-white"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-3">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold text-slate-300"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-semibold text-white shadow-lg shadow-blue-600/30"
                    >
                      Save Log Entry
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LogisticsOperationsPortal />);
  </script>
</body>
</html>
