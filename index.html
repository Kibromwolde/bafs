<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAFS TRADING TRANSPORT MANAGEMENT SYSTEM</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bafs: {
              gold: '#D4AF37',
              dark: '#0F172A',
              card: '#1E293B',
              border: '#334155'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // READ-ONLY DATA FROM BAFS EXCEL TEMPLATE
    const INITIAL_ACCOUNTS = [

      { id: 2, acc: "1000010277427", amount: 11545.69, bank: "CBE" },
      { id: 3, acc: "1000010277427", amount: 45500.18, bank: "CBE" },
      { id: 4, acc: "1000591321707", amount: 11000.00, bank: "CBE" },
      { id: 5, acc: "1000597909512", amount: 24000.34, bank: "CBE" },
      { id: 6, acc: "1000390460345", amount: 18000.24, bank: "CBE" },

    const INITIAL_OPERATIONS = [
      {
        id: "JOB-9012",
        driverName: "Abebe Kebede",

        cargoType: "Container (40ft)",

        origin: "Djibouti Port",

        fuelAllowance: "15,000.00 ETB",

        dispatchDate: "2026-09-24"
      },
      {
        id: "JOB-9013",
        driverName: "Mulugeta Tadesse",
        driverPhone: "+251922334455",
        plateNumber: "3-88901 ET",
        cargoType: "Bulk Steel",
        cargoWeight: "35 Tons",
        origin: "Kality Customs",
        destination: "Galafi Border",
        linkedAccount: "1000591321707",
        fuelAllowance: "11,000.00 ETB",
        status: "Customs Cleared",
        dispatchDate: "2026-09-23"
      },
      {
        id: "JOB-9014",
        driverName: "Bekele Alemu",
        driverPhone: "+251933445566",
        plateNumber: "3-12004 ET",
        cargoType: "Fertilizer Bags",
        cargoWeight: "30 Tons",
        origin: "Semera",
        destination: "Addis Ababa",
        linkedAccount: "1000597909512",
        fuelAllowance: "24,000.00 ETB",
        status: "Delivered",

      }

    const TRANSLATIONS = {
      en: {
        title: "BAFS TRADING PLC",
        subtitle: "Transport & Credit Management System",
        dashboard: "Dashboard",
        credits: "Credit Pool",
        ops: "Operations",
        newDispatch: "New Operation",
        readOnlyNotice: "Locked Excel Master Ledger (Read-Only)",
        totalCreditPool: "Total Credit Pool",
        totalAccounts: "Linked Credit Records",
        activeOperations: "Active Operations",
        deliveredOperations: "Completed Trips",
        recentOperationsTitle: "Live Fleet Operations",
        searchPlaceholder: "Search plate, driver, destination, or Job ID...",
        createTitle: "Dispatch & Register New Operation",
        createSubtitle: "Assign freight, link credit account & dispatch truck",
        plateNumber: "Truck Plate Number *",
        driverName: "Driver Full Name *",
        driverPhone: "Driver Phone Number *",
        cargoType: "Cargo Type / Goods *",
        cargoWeight: "Cargo Weight (Tons) *",
        originPoint: "Origin Location *",

        selectAccountPlaceholder: "-- Select Verified BAFS Credit Account --",
        submitBtn: "Confirm & Dispatch Operation",
        cancelBtn: "Reset Form",
        successMsg: "New transport operation successfully registered and dispatched!",
        statusPending: "Pending Dispatch",
        statusInTransit: "In Transit",
        statusCustoms: "Customs Cleared",
        statusDelivered: "Delivered",
        viewDetails: "View Details",
        updateStatus: "Update Status"
      },
      am: {
        title: "ባፍስ ትሬዲንግ ኃ/የተ/የግ/ማህበር",
        subtitle: "የትራንስፖርት እና የብድር አስተዳደር",
        dashboard: "ዳሽቦርድ",
        credits: "የብድር አካውንቶች",
        ops: "የስራ እንቅስቃሴዎች",
        newDispatch: "አዲስ ስራ መመዝገቢያ",
        readOnlyNotice: "የተቆለፈ የኤክሴል ዋና መዝገብ (Read-Only)",
        totalCreditPool: "ጠቅላላ የብድር መጠን",
        totalAccounts: "የተመዘገቡ አካውንቶች",
        activeOperations: "በመንገድ ላይ ያሉ",
        deliveredOperations: "የተጠናቀቁ ጉዞዎች",
        recentOperationsTitle: "የአሁኑ የትራንስፖርት ስራዎች",
        searchPlaceholder: "በታርጋ፣ በሾፌር ስም፣ በቦታ ወይም JOB ID ፈልግ...",
        createTitle: "አዲስ የትራንስፖርት ስራ መመዝገቢያ",
        createSubtitle: "ጭነት መደብ፣ የብድር አካውንት አያይዝ እና መኪና አሰማራ",
        plateNumber: "የተሽከርካሪ ታርጋ ቁጥር *",
        driverName: "የሾፌሩ ሙሉ ስም *",
        driverPhone: "የሾፌሩ ስልክ ቁጥር *",
        cargoType: "የጭነቱ አይነት / እቃ *",
        cargoWeight: "የጭነቱ ክብደት (በቶን) *",
        originPoint: "የመነሻ ቦታ *",
        destinationPoint: "የመድረሻ ቦታ *",
        linkCreditAccount: "የባፍስ ብድር አካውንት ምረጥ *",
        fuelAllowance: "የነዳጅ እና አበል ወጪ (ETB) *",
        selectAccountPlaceholder: "-- የተረጋገጠ የባፍስ አካውንት ምረጥ --",
        submitBtn: "ስራውን መዝግብ እና አሰማራ",
        cancelBtn: "ፎርሙን አጽዳ",
        successMsg: "አዲሱ የትራንስፖርት ስራ በስኬት ተመዝግቦ ተሰማርቷል!",
        statusPending: "በዝግጅት ላይ",
        statusInTransit: "በመጓጓዝ ላይ",
        statusCustoms: "ጉምሩክ የተለቀቀ",
        statusDelivered: "ደርሷል",
        viewDetails: "ዝርዝር እይ",
        updateStatus: "ሁኔታውን ቀይር"
      }
    };

    function App() {
      const [lang, setLang] = useState('am');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [operations, setOperations] = useState(INITIAL_OPERATIONS);
      const [selectedOp, setSelectedOp] = useState(null);
      const [showToast, setShowToast] = useState(false);

      // New Operation Form State
      const [formData, setFormData] = useState({
        plateNumber: '',
        driverName: '',
        driverPhone: '',
        cargoType: '',
        cargoWeight: '',
        origin: '',
        destination: '',
        linkedAccount: '',
        fuelAllowance: ''
      });

      const t = TRANSLATIONS[lang];

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      const totalCreditPool = useMemo(() => {
        return INITIAL_ACCOUNTS.reduce((sum, item) => sum + item.amount, 0).toLocaleString('en-US', { minimumFractionDigits: 2 });
      }, []);

      const filteredOperations = useMemo(() => {
        if (!searchQuery) return operations;
        const q = searchQuery.toLowerCase();
        return operations.filter(op => 
          op.id.toLowerCase().includes(q) ||
          op.driverName.toLowerCase().includes(q) ||
          op.plateNumber.toLowerCase().includes(q) ||
          op.destination.toLowerCase().includes(q) ||
          op.origin.toLowerCase().includes(q)
        );
      }, [operations, searchQuery]);

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!formData.plateNumber || !formData.driverName || !formData.linkedAccount) {
          alert(lang === 'am' ? 'እባክዎን የሚያስፈልጉትን መረጃዎች በሙሉ ይሙሉ!' : 'Please fill in all required fields!');
          return;
        }

        const newJob = {
          id: `JOB-${Math.floor(1000 + Math.random() * 9000)}`,
          driverName: formData.driverName,
          driverPhone: formData.driverPhone || 'N/A',
          plateNumber: formData.plateNumber,
          cargoType: formData.cargoType || 'General Cargo',
          cargoWeight: formData.cargoWeight ? `${formData.cargoWeight} Tons` : 'N/A',
          origin: formData.origin || 'Kality Terminal',
          destination: formData.destination || 'Regional Destination',
          linkedAccount: formData.linkedAccount,
          fuelAllowance: formData.fuelAllowance ? `${Number(formData.fuelAllowance).toLocaleString()} ETB` : '0.00 ETB',
          status: 'Pending Dispatch',
          dispatchDate: new Date().toISOString().split('T')[0]
        };

        setOperations([newJob, ...operations]);
        setFormData({
          plateNumber: '',
          driverName: '',
          driverPhone: '',
          cargoType: '',
          cargoWeight: '',
          origin: '',
          destination: '',
          linkedAccount: '',
          fuelAllowance: ''
        });

        setShowToast(true);
        setTimeout(() => setShowToast(false), 4000);
        setActiveTab('ops');
      };

      const handleStatusChange = (id, newStatus) => {
        setOperations(operations.map(op => op.id === id ? { ...op, status: newStatus } : op));
        if (selectedOp && selectedOp.id === id) {
          setSelectedOp({ ...selectedOp, status: newStatus });
        }
      };

      return (
        <div class="max-w-md mx-auto min-h-screen pb-20 font-sans bg-slate-950 text-slate-100 flex flex-col justify-between">
          <div>
            {/* Header */}
            <div class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-20 shadow-xl">
              <div>
                <h1 class="text-base font-bold text-amber-400 flex items-center gap-2">
                  🚛 {t.title}
                </h1>
                <p class="text-[11px] text-slate-400">{t.subtitle}</p>
              </div>
              <button 
                onClick={() => setLang(lang === 'am' ? 'en' : 'am')}
                class="px-2.5 py-1 bg-amber-400/10 text-amber-400 text-xs font-bold rounded-lg border border-amber-400/30 hover:bg-amber-400/20 transition"
              >
                {lang === 'am' ? '🇬🇧 EN' : '🇪🇹 አማርኛ'}
              </button>
            </div>

            {/* Notification Toast */}
            {showToast && (
              <div class="m-4 p-3 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold rounded-xl flex items-center gap-2 shadow-lg animate-bounce">
                <span>✅</span>
                <span>{t.successMsg}</span>
              </div>
            )}

            {/* Main Content Areas */}
            <div class="p-4 space-y-4">

              {/* TAB 1: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div class="space-y-4">
                  {/* Top Stats Cards */}
                  <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 shadow-md">
                      <p class="text-[10px] text-slate-400 uppercase tracking-wider">{t.totalCreditPool}</p>
                      <p class="text-sm font-extrabold text-amber-400 mt-1">{totalCreditPool} <span class="text-[10px] text-slate-400 font-normal">ETB</span></p>
                      <span class="inline-block mt-1 text-[9px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">🔒 Excel Read-Only</span>
                    </div>
                    <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 shadow-md">
                      <p class="text-[10px] text-slate-400 uppercase tracking-wider">{t.activeOperations}</p>
                      <p class="text-lg font-extrabold text-sky-400 mt-1">
                        {operations.filter(o => o.status !== 'Delivered').length} <span class="text-xs font-normal text-slate-400">Trucks</span>
                      </p>
                      <span class="inline-block mt-1 text-[9px] bg-sky-500/10 text-sky-400 px-1.5 py-0.5 rounded">Live Transit</span>
                    </div>
                  </div>

                  {/* Dispatch Shortcut Action */}
                  <button 
                    onClick={() => setActiveTab('new')}
                    class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold rounded-xl shadow-lg flex justify-between items-center transition"
                  >
                    <span class="flex items-center gap-2 text-xs">
                      ➕ <span>{t.newDispatch}</span>
                    </span>
                    <span class="text-xs bg-slate-950/20 px-2 py-0.5 rounded font-mono">NEW +</span>
                  </button>

                  {/* Operations List Summary */}
                  <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center">
                      <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">
                        {t.recentOperationsTitle}
                      </h3>
                      <button onClick={() => setActiveTab('ops')} class="text-[11px] text-amber-400 hover:underline font-semibold">
                        View All ({operations.length}) →
                      </button>
                    </div>

                    <div class="space-y-2">
                      {operations.slice(0, 3).map(op => (
                        <div 
                          key={op.id} 
                          onClick={() => setSelectedOp(op)}
                          class="p-3 bg-slate-950/80 rounded-xl border border-slate-800/80 hover:border-amber-500/40 transition cursor-pointer flex justify-between items-center text-xs"
                        >
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="font-mono text-amber-400 font-bold">{op.id}</span>
                              <span class="text-slate-300 font-semibold">{op.driverName}</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5">{op.plateNumber} • <span class="text-slate-300">{op.origin} ➔ {op.destination}</span></p>
                          </div>
                          <span class={`px-2 py-1 rounded-md text-[10px] font-bold ${
                            op.status === 'Delivered' ? 'bg-emerald-500/20 text-emerald-400' :
                            op.status === 'In Transit' ? 'bg-sky-500/20 text-sky-400' :
                            op.status === 'Customs Cleared' ? 'bg-purple-500/20 text-purple-400' :
                            'bg-amber-500/20 text-amber-400'
                          }`}>
                            {op.status}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: READ-ONLY CREDIT ACCOUNTS */}
              {activeTab === 'credits' && (
                <div class="space-y-3">
                  <div class="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl flex justify-between items-center text-xs">
                    <div>
                      <p class="font-bold text-amber-400">🔒 {t.readOnlyNotice}</p>
                      <p class="text-[10px] text-slate-400 mt-0.5">Feed-only values derived directly from BAFS Excel bulk template.</p>
                    </div>
                    <span class="text-xs font-mono font-bold text-emerald-400">{totalCreditPool} ETB</span>
                  </div>

                  <div class="space-y-2">
                    {INITIAL_ACCOUNTS.map((acc, index) => (
                      <div key={index} class="p-3.5 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded">
                              {acc.bank}
                            </span>
                            <span class="text-[11px] text-slate-400 font-mono">Record #{index + 1}</span>
                          </div>
                          <p class="text-xs font-mono text-slate-200 font-bold mt-1.5">{acc.acc}</p>
                        </div>
                        <div class="text-right">
                          <p class="text-sm font-extrabold text-emerald-400">{acc.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} <span class="text-[10px] text-slate-400">ETB</span></p>
                          <span class="text-[9px] px-2 py-0.5 bg-slate-800 text-slate-400 rounded-md inline-block mt-1 border border-slate-700">
                            🔒 Non-Editable
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: ALL OPERATIONS & SEARCH */}
              {activeTab === 'ops' && (
                <div class="space-y-3">
                  {/* Search Bar */}
                  <div class="relative">
                    <input 
                      type="text"
                      placeholder={t.searchPlaceholder}
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 pl-9 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition"
                    />
                    <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
                  </div>

                  <div class="space-y-2">
                    {filteredOperations.length === 0 ? (
                      <div class="text-center py-8 text-slate-500 text-xs">No matching operations found.</div>
                    ) : (
                      filteredOperations.map(op => (
                        <div 
                          key={op.id}
                          class="p-3.5 bg-slate-900 rounded-xl border border-slate-800 hover:border-slate-700 transition space-y-2"
                        >
                          <div class="flex justify-between items-start">
                            <div>
                              <span class="text-xs font-mono font-bold text-amber-400">{op.id}</span>
                              <h4 class="text-xs font-bold text-white mt-0.5">{op.driverName} <span class="text-slate-400 text-[11px]">({op.plateNumber})</span></h4>
                            </div>
                            <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              op.status === 'Delivered' ? 'bg-emerald-500/20 text-emerald-400' :
                              op.status === 'In Transit' ? 'bg-sky-500/20 text-sky-400' :
                              op.status === 'Customs Cleared' ? 'bg-purple-500/20 text-purple-400' :
                              'bg-amber-500/20 text-amber-400'
                            }`}>
                              {op.status}
                            </span>
                          </div>

                          <div class="text-[11px] text-slate-400 grid grid-cols-2 gap-1 border-t border-slate-800/60 pt-2">
                            <div>📍 <span class="text-slate-300">{op.origin} ➔ {op.destination}</span></div>
                            <div>📦 <span class="text-slate-300">{op.cargoType}</span></div>
                            <div>💳 Acc: <span class="font-mono text-slate-300">{op.linkedAccount}</span></div>
                            <div>⛽ Fuel: <span class="text-amber-400 font-semibold">{op.fuelAllowance}</span></div>
                          </div>

                          <div class="flex gap-2 pt-1">
                            <button 
                              onClick={() => handleStatusChange(op.id, op.status === 'In Transit' ? 'Delivered' : 'In Transit')}
                              class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-300 rounded-lg transition border border-slate-700"
                            >
                              🔄 Toggle Status
                            </button>
                            <button 
                              onClick={() => setSelectedOp(op)}
                              class="px-3 py-1.5 bg-amber-400/10 hover:bg-amber-400/20 text-[10px] font-bold text-amber-400 rounded-lg transition border border-amber-400/20"
                            >
                              🔍 Details
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* TAB 4: ADD NEW OPERATION FORM */}
              {activeTab === 'new' && (
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
                  <div>
                    <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                      ➕ {t.createTitle}
                    </h2>
                    <p class="text-[11px] text-slate-400 mt-0.5">{t.createSubtitle}</p>
                  </div>

                  <form onSubmit={handleFormSubmit} class="space-y-3 text-xs">
                    <div>
                      <label class="block text-slate-400 mb-1 font-semibold">{t.plateNumber}</label>
                      <input 
                        type="text" 
                        required
                        placeholder="e.g., 3-54321 ET"
                        value={formData.plateNumber}
                        onChange={(e) => setFormData({ ...formData, plateNumber: e.target.value })}
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                      />
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-slate-400 mb-1 font-semibold">{t.driverName}</label>
                        <input 
                          type="text" 
                          required
                          placeholder="Full Name"
                          value={formData.driverName}
                          onChange={(e) => setFormData({ ...formData, driverName: e.target.value })}
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                        />
                      </div>
                      <div>
                        <label class="block text-slate-400 mb-1 font-semibold">{t.driverPhone}</label>
                        <input 
                          type="text" 
                          placeholder="+251 9..."
                          value={formData.driverPhone}
                          onChange={(e) => setFormData({ ...formData, driverPhone: e.target.value })}
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                        />
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-slate-400 mb-1 font-semibold">{t.cargoType}</label>
                        <input 
                          type="text" 
                          placeholder="Container, Steel, etc."
                          value={formData.cargoType}
                          onChange={(e) => setFormData({ ...formData, cargoType: e.target.value })}
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                        />
                      </div>
                      <div>
                        <label class="block text-slate-400 mb-1 font-semibold">{t.cargoWeight}</label>
                        <input 
                          type="number" 
                          placeholder="Weight in Tons"
                          value={formData.cargoWeight}
                          onChange={(e) => setFormData({ ...formData, cargoWeight: e.target.value })}
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                        />
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-slate-400 mb-1 font-semibold">{t.originPoint}</label>
                        <input 
                          type="text" 
                          placeholder="e.g. Djibouti Port"
                          value={formData.origin}
                          onChange={(e) => setFormData({ ...formData, origin: e.target.value })}
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                        />
                      </div>
                      <div>
                        <label class="block text-slate-400 mb-1 font-semibold">{t.destinationPoint}</label>
                        <input 
                          type="text" 
                          placeholder="e.g. Modjo Dry Port"
                          value={formData.destination}
                          onChange={(e) => setFormData({ ...formData, destination: e.target.value })}
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                        />
                      </div>
                    </div>

                    <div>
                      <label class="block text-slate-400 mb-1 font-semibold">{t.linkCreditAccount}</label>
                      <select 
                        required
                        value={formData.linkedAccount}
                        onChange={(e) => setFormData({ ...formData, linkedAccount: e.target.value })}
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-amber-300 font-mono focus:outline-none focus:border-amber-400"
                      >
                        <option value="">{t.selectAccountPlaceholder}</option>
                        {INITIAL_ACCOUNTS.map((acc, i) => (
                          <option key={i} value={acc.acc}>
                            {acc.acc} ({acc.amount.toLocaleString()} ETB)
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label class="block text-slate-400 mb-1 font-semibold">{t.fuelAllowance}</label>
                      <input 
                        type="number" 
                        placeholder="Amount in ETB"
                        value={formData.fuelAllowance}
                        onChange={(e) => setFormData({ ...formData, fuelAllowance: e.target.value })}
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"
                      />
                    </div>

                    <button 
                      type="submit"
                      class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold rounded-xl shadow-lg transition mt-2 text-xs uppercase tracking-wider"
                    >
                      🚀 {t.submitBtn}
                    </button>
                  </form>
                </div>
              )}

            </div>
          </div>

          {/* Details Modal */}
          {selectedOp && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl text-xs">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <span class="text-amber-400 font-mono font-bold">{selectedOp.id}</span>
                    <h3 class="text-sm font-bold text-white mt-0.5">{selectedOp.driverName}</h3>
                  </div>
                  <button onClick={() => setSelectedOp(null)} class="text-slate-400 text-base font-bold">✕</button>
                </div>

                <div class="space-y-2 text-slate-300">
                  <p>🚚 <strong>Plate:</strong> {selectedOp.plateNumber}</p>
                  <p>📞 <strong>Phone:</strong> {selectedOp.driverPhone}</p>
                  <p>📦 <strong>Cargo:</strong> {selectedOp.cargoType} ({selectedOp.cargoWeight})</p>
                  <p>🗺️ <strong>Route:</strong> {selectedOp.origin} ➔ {selectedOp.destination}</p>
                  <p>💳 <strong>Linked Account:</strong> <span class="font-mono text-amber-300">{selectedOp.linkedAccount}</span></p>
                  <p>⛽ <strong>Fuel Allowance:</strong> {selectedOp.fuelAllowance}</p>
                  <p>📅 <strong>Dispatch Date:</strong> {selectedOp.dispatchDate}</p>
                  <p>📊 <strong>Status:</strong> <span class="text-amber-400 font-bold">{selectedOp.status}</span></p>
                </div>

                <button 
                  onClick={() => setSelectedOp(null)}
                  class="w-full py-2.5 bg-slate-800 text-slate-200 font-bold rounded-xl border border-slate-700"
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Navigation Bar */}
          <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 max-w-md mx-auto flex justify-around p-2 text-xs z-30">
            <button 
              onClick={() => setActiveTab('dashboard')}
              class={`flex-1 py-2 flex flex-col items-center font-bold rounded-xl transition ${activeTab === 'dashboard' ? 'text-amber-400 bg-slate-800/80' : 'text-slate-400 hover:text-slate-200'}`}
            >
              📊 <span>{t.dashboard}</span>
            </button>
            <button 
              onClick={() => setActiveTab('credits')}
              class={`flex-1 py-2 flex flex-col items-center font-bold rounded-xl transition ${activeTab === 'credits' ? 'text-amber-400 bg-slate-800/80' : 'text-slate-400 hover:text-slate-200'}`}
            >
              💳 <span>{t.credits}</span>
            </button>
            <button 
              onClick={() => setActiveTab('ops')}
              class={`flex-1 py-2 flex flex-col items-center font-bold rounded-xl transition ${activeTab === 'ops' ? 'text-amber-400 bg-slate-800/80' : 'text-slate-400 hover:text-slate-200'}`}
            >
              🚚 <span>{t.ops}</span>
            </button>
            <button 
              onClick={() => setActiveTab('new')}
              class={`flex-1 py-2 flex flex-col items-center font-bold rounded-xl transition ${activeTab === 'new' ? 'text-amber-400 bg-slate-800/80' : 'text-slate-400 hover:text-slate-200'}`}
            >
              ➕ <span>{t.newDispatch}</span>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
