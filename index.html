<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAFS TRADING - Transport Management System</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom scrollbar for mobile container */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    /* Prevent pull-to-refresh on Telegram mobile webview */
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL BAFS BULK DATA MODEL (Matching BAFS_bulk_template Excel) ---
    const INITIAL_BAFS_ACCOUNTS = [
      { id: 'BAFS-01', creditAccount: '1000010277427', amount: 10550.00, beneficiary: 'Abebe Bikila (Per-Diem)', status: 'Approved', type: 'Driver Per-Diem' },
      { id: 'BAFS-02', creditAccount: '1000010277427', amount: 11545.69, beneficiary: 'Abebe Bikila (Fuel Expense)', status: 'Approved', type: 'Fuel Allowance' },
      { id: 'BAFS-03', creditAccount: '1000010277427', amount: 45500.18, beneficiary: 'Abebe Bikila (Corridor Tariff)', status: 'Approved', type: 'Freight Tariff' },
      { id: 'BAFS-04', creditAccount: '1000591321707', amount: 11000.00, beneficiary: 'Kebede Tassew (Allowance)', status: 'Approved', type: 'Driver Per-Diem' },
      { id: 'BAFS-05', creditAccount: '1000597909512', amount: 24000.34, beneficiary: 'Almaz Ayana Logistics PLC', status: 'Pending', type: 'Subcontractor' },
      { id: 'BAFS-06', creditAccount: '1000390460345', amount: 18000.24, beneficiary: 'Mojo Port Handling Agent', status: 'Approved', type: 'Port Handling' },
      { id: 'BAFS-07', creditAccount: '1000390460345', amount: 14000.56, beneficiary: 'Dry Port Discharge Service', status: 'Approved', type: 'Port Handling' },
      { id: 'BAFS-08', creditAccount: '1000417706171', amount: 10550.00, beneficiary: 'Tewodros Kassahun (Per-Diem)', status: 'Pending', type: 'Driver Per-Diem' },
      { id: 'BAFS-09', creditAccount: '1000262015606', amount: 7358.88, beneficiary: 'Galafi Border Customs Fee', status: 'Approved', type: 'Customs Duty' },
      { id: 'BAFS-10', creditAccount: '1000371841699', amount: 16000.75, beneficiary: 'Semera Freight Terminal', status: 'Approved', type: 'Transit Hub Fee' }
    ];

    // --- INITIAL TRANSPORT OPERATIONS DATA ---
    const INITIAL_OPERATIONS = [
      { id: 'BAFS-TR-901', driver: 'Mulugeta Tesfaye', plateNo: '3-ET-34211', origin: 'Port of Djibouti', destination: 'Mojo Dry Port', cargo: 'Fertilizer (30 MT)', status: 'IN_TRANSIT', checkpoint: 'Galafi Border', eta: 'Today, 18:00', totalTariff: 67595.87, creditAccount: '1000010277427' },
      { id: 'BAFS-TR-902', driver: 'Dawit Getachew', plateNo: '3-ET-11892', origin: 'Mojo Dry Port', destination: 'Hawassa Industrial Park', cargo: 'Machinery Spare Parts', status: 'CUSTOMS_HOLD', checkpoint: 'Awash Checkpoint', eta: 'Tomorrow, 10:00', totalTariff: 24000.34, creditAccount: '1000597909512' },
      { id: 'BAFS-TR-903', driver: 'Sintayehu Haile', plateNo: '3-ET-99012', origin: 'Semera Hub', destination: 'Addis Ababa (Kaliti)', cargo: 'Commercial Merchandise', status: 'DELIVERED', checkpoint: 'Kaliti Terminal', eta: 'Completed', totalTariff: 32000.80, creditAccount: '1000390460345' },
      { id: 'BAFS-TR-904', driver: 'Yared Hagos', plateNo: '3-ET-55421', origin: 'Port of Djibouti', destination: 'Kombolcha Dry Port', cargo: 'Wheat Grain (35 MT)', status: 'IN_TRANSIT', checkpoint: 'Mille Station', eta: 'Tomorrow, 14:00', totalTariff: 11000.00, creditAccount: '1000591321707' }
    ];

    function BafsTelegramMiniApp() {
      // Navigation Tab State
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Data States with LocalStorage Persistence
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('bafs_accounts');
        return saved ? JSON.parse(saved) : INITIAL_BAFS_ACCOUNTS;
      });

      const [operations, setOperations] = useState(() => {
        const saved = localStorage.getItem('bafs_operations');
        return saved ? JSON.parse(saved) : INITIAL_OPERATIONS;
      });

      // Filter & Search States
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');

      // Modal & Form States
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingOp, setEditingOp] = useState(null);
      const [formData, setFormData] = useState({
        id: '',
        driver: '',
        plateNo: '',
        origin: 'Port of Djibouti',
        destination: 'Mojo Dry Port',
        cargo: '',
        status: 'IN_TRANSIT',
        checkpoint: 'Galafi Border',
        eta: 'Today, 18:00',
        totalTariff: '',
        creditAccount: '1000010277427'
      });

      // Telegram User Profile Context
      const [tgUser, setTgUser] = useState(null);

      // Save Data to LocalStorage
      useEffect(() => {
        localStorage.setItem('bafs_accounts', JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        localStorage.setItem('bafs_operations', JSON.stringify(operations));
      }, [operations]);

      // Initialize Telegram WebApp SDK
      useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand(); // Expand Mini App to full height
          
          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            setTgUser(tg.initDataUnsafe.user);
          }

          // Native Telegram Main Button Trigger
          tg.MainButton.setText("ADD NEW TRANSPORT JOB");
          tg.MainButton.onClick(() => handleOpenAddModal());
          tg.MainButton.show();
        }
      }, []);

      // Refresh Lucide Icons after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, operations, accounts, searchTerm, statusFilter, isModalOpen]);

      // Trigger Telegram Haptic Feedback
      const triggerHaptic = (type = 'impact') => {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
          if (type === 'impact') window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
          if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
      };

      // Financial Metrics Calculation
      const totalDisbursement = useMemo(() => {
        return accounts.reduce((acc, item) => acc + Number(item.amount), 0);
      }, [accounts]);

      const pendingDisbursement = useMemo(() => {
        return accounts
          .filter(a => a.status === 'Pending')
          .reduce((acc, item) => acc + Number(item.amount), 0);
      }, [accounts]);

      // CRUD Handlers
      const handleOpenAddModal = () => {
        triggerHaptic('impact');
        setEditingOp(null);
        setFormData({
          id: `BAFS-TR-${Math.floor(100 + Math.random() * 900)}`,
          driver: '',
          plateNo: '',
          origin: 'Port of Djibouti',
          destination: 'Mojo Dry Port',
          cargo: '',
          status: 'IN_TRANSIT',
          checkpoint: 'Galafi Border',
          eta: 'Today, 20:00',
          totalTariff: '15000',
          creditAccount: '1000010277427'
        });
        setIsModalOpen(true);
      };

      const handleOpenEditModal = (op) => {
        triggerHaptic('impact');
        setEditingOp(op.id);
        setFormData({ ...op });
        setIsModalOpen(true);
      };

      const handleDeleteOp = (id) => {
        triggerHaptic('impact');
        if (confirm("Are you sure you want to delete this transport job?")) {
          setOperations(operations.filter(item => item.id !== id));
          triggerHaptic('success');
        }
      };

      const handleSaveOperation = (e) => {
        e.preventDefault();
        triggerHaptic('success');

        if (editingOp) {
          setOperations(operations.map(item => item.id === editingOp ? { ...formData, totalTariff: parseFloat(formData.totalTariff) } : item));
        } else {
          setOperations([{ ...formData, totalTariff: parseFloat(formData.totalTariff) || 0 }, ...operations]);
        }

        setIsModalOpen(false);
      };

      // Search & Filtered Operations
      const filteredOperations = operations.filter(op => {
        const matchesSearch = 
          op.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
          op.driver.toLowerCase().includes(searchTerm.toLowerCase()) ||
          op.plateNo.toLowerCase().includes(searchTerm.toLowerCase()) ||
          op.cargo.toLowerCase().includes(searchTerm.toLowerCase());
        
        const matchesStatus = statusFilter === 'ALL' || op.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100 max-w-md mx-auto relative pb-20 border-x border-slate-800 shadow-2xl">
          
          {/* TOP HEADER */}
          <header className="bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 p-4 flex justify-between items-center">
            <div className="flex items-center space-x-3">
              <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-600/30">
                <i data-lucide="truck" class="h-5 w-5 text-white"></i>
              </div>
              <div>
                <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
                  BAFS TRADING
                  <span className="text-[10px] bg-blue-500/20 text-blue-400 font-mono px-1.5 py-0.5 rounded border border-blue-500/30">TMS</span>
                </h1>
                <p className="text-[11px] text-slate-400">Ethiopian Transport Management</p>
              </div>
            </div>

            <div className="text-right">
              <div className="text-xs font-semibold text-slate-200">
                {tgUser ? `${tgUser.first_name}` : 'Operator'}
              </div>
              <div className="text-[10px] text-emerald-400 font-mono flex items-center justify-end gap-1">
                <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Telegram WebApp
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA BASED ON TAB */}
          <main className="flex-1 p-4 space-y-5">

            {/* TAB 1: DASHBOARD OVERVIEW */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                {/* Metrics Cards */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                    <div className="flex justify-between items-center text-slate-400 mb-1">
                      <span className="text-xs font-medium">Active Fleet</span>
                      <i data-lucide="truck" class="h-4 w-4 text-blue-400"></i>
                    </div>
                    <div className="text-xl font-bold text-white font-mono">
                      {operations.filter(o => o.status === 'IN_TRANSIT').length} Units
                    </div>
                    <p className="text-[10px] text-emerald-400 mt-1">Djibouti Corridor</p>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                    <div className="flex justify-between items-center text-slate-400 mb-1">
                      <span className="text-xs font-medium">BAFS Budget</span>
                      <i data-lucide="credit-card" class="h-4 w-4 text-emerald-400"></i>
                    </div>
                    <div className="text-lg font-bold text-emerald-400 font-mono">
                      {totalDisbursement.toLocaleString('en-US', { maximumFractionDigits: 0 })} ETB
                    </div>
                    <p className="text-[10px] text-slate-400 mt-1">10 Accounts Queued</p>
                  </div>
                </div>

                {/* Operations Quick Status */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <div className="flex justify-between items-center">
                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                      <i data-lucide="activity" class="h-4 w-4 text-blue-400"></i>
                      Corridor Operational Status
                    </h2>
                    <button 
                      onClick={() => setActiveTab('operations')} 
                      className="text-xs text-blue-400 font-semibold flex items-center gap-1"
                    >
                      View All
                      <i data-lucide="chevron-right" class="h-3 w-3"></i>
                    </button>
                  </div>

                  <div className="space-y-2">
                    {operations.slice(0, 3).map(op => (
                      <div key={op.id} className="bg-slate-950 border border-slate-800/80 p-3 rounded-xl flex justify-between items-center">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-blue-400 font-mono">{op.id}</span>
                            <span className="text-xs font-medium text-white">{op.driver}</span>
                          </div>
                          <p className="text-[11px] text-slate-400 mt-0.5">{op.origin} ➔ {op.destination}</p>
                        </div>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${
                          op.status === 'IN_TRANSIT' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                          op.status === 'CUSTOMS_HOLD' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                          'bg-blue-500/10 text-blue-400 border-blue-500/20'
                        }`}>
                          {op.status.replace('_', ' ')}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Quick Add Banner */}
                <div className="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-800/50 p-4 rounded-2xl flex justify-between items-center">
                  <div>
                    <h3 className="text-sm font-bold text-white">Create New Waybill</h3>
                    <p className="text-xs text-slate-400">Dispatch heavy trucks on corridor</p>
                  </div>
                  <button 
                    onClick={handleOpenAddModal}
                    className="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/30 flex items-center gap-1.5"
                  >
                    <i data-lucide="plus" class="h-4 w-4"></i>
                    Dispatch
                  </button>
                </div>
              </div>
            )}

            {/* TAB 2: TRANSPORT OPERATIONS (FULL CRUD) */}
            {activeTab === 'operations' && (
              <div className="space-y-4">
                {/* Search & Filter Header */}
                <div className="space-y-2">
                  <div className="relative">
                    <input 
                      type="text" 
                      placeholder="Search Driver, Plate, ID, Cargo..."
                      value={searchTerm}
                      onChange={e => setSearchTerm(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                    />
                    <div className="absolute left-3 top-2.5 text-slate-500">
                      <i data-lucide="search" class="h-4 w-4"></i>
                    </div>
                  </div>

                  {/* Status Chips */}
                  <div className="flex gap-2 overflow-x-auto pb-1 text-[11px] font-medium">
                    {['ALL', 'IN_TRANSIT', 'CUSTOMS_HOLD', 'DELIVERED'].map(st => (
                      <button
                        key={st}
                        onClick={() => { triggerHaptic(); setStatusFilter(st); }}
                        className={`px-3 py-1.5 rounded-lg whitespace-nowrap transition border ${
                          statusFilter === st 
                            ? 'bg-blue-600 text-white border-blue-500' 
                            : 'bg-slate-900 text-slate-400 border-slate-800'
                        }`}
                      >
                        {st.replace('_', ' ')}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Operations List */}
                <div className="space-y-3">
                  {filteredOperations.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-xs">
                      No transport jobs found.
                    </div>
                  ) : (
                    filteredOperations.map(op => (
                      <div key={op.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-xs font-mono font-bold text-blue-400">{op.id}</span>
                            <h3 className="text-sm font-bold text-white mt-0.5">{op.driver}</h3>
                            <p className="text-[11px] text-slate-400 font-mono">{op.plateNo}</p>
                          </div>
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold border ${
                            op.status === 'IN_TRANSIT' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                            op.status === 'CUSTOMS_HOLD' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                            'bg-blue-500/10 text-blue-400 border-blue-500/20'
                          }`}>
                            {op.status.replace('_', ' ')}
                          </span>
                        </div>

                        <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 text-xs space-y-1 font-mono">
                          <div className="flex justify-between text-slate-300">
                            <span>Route:</span>
                            <span className="text-white">{op.origin} ➔ {op.destination}</span>
                          </div>
                          <div className="flex justify-between text-slate-300">
                            <span>Checkpoint:</span>
                            <span className="text-amber-400">{op.checkpoint}</span>
                          </div>
                          <div className="flex justify-between text-slate-300">
                            <span>Cargo:</span>
                            <span className="text-slate-200">{op.cargo}</span>
                          </div>
                        </div>

                        <div className="flex justify-between items-center pt-1">
                          <div className="text-xs">
                            <span className="text-slate-500 text-[10px] block">CBE Account</span>
                            <span className="font-mono text-emerald-400 text-xs">{op.creditAccount}</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button 
                              onClick={() => handleOpenEditModal(op)}
                              className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300"
                            >
                              <i data-lucide="edit-3" class="h-3.5 w-3.5"></i>
                            </button>
                            <button 
                              onClick={() => handleDeleteOp(op.id)}
                              className="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg"
                            >
                              <i data-lucide="trash-2" class="h-3.5 w-3.5"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* TAB 3: BAFS ACCOUNTS & BULK SETTLEMENTS */}
            {activeTab === 'accounts' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <h2 className="text-sm font-bold text-white flex items-center gap-2 mb-1">
                    <i data-lucide="file-spreadsheet" class="h-4 w-4 text-emerald-400"></i>
                    BAFS Bulk Account Disbursements
                  </h2>
                  <p className="text-xs text-slate-400">
                    Commercial Bank of Ethiopia (CBE) bulk payment ledger.
                  </p>
                </div>

                <div className="space-y-2.5">
                  {accounts.map(acc => (
                    <div key={acc.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex justify-between items-center">
                      <div>
                        <div className="text-xs font-mono font-bold text-blue-400">{acc.creditAccount}</div>
                        <div className="text-xs font-medium text-white mt-0.5">{acc.beneficiary}</div>
                        <div className="text-[10px] text-slate-500">{acc.type}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-xs font-bold text-emerald-400 font-mono">
                          {acc.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} ETB
                        </div>
                        <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full inline-block mt-1 ${
                          acc.status === 'Approved' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'
                        }`}>
                          {acc.status}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2.5 flex justify-between z-40">
            <button 
              onClick={() => { triggerHaptic(); setActiveTab('dashboard'); }}
              className={`flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-blue-500' : 'text-slate-500'}`}
            >
              <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
              <span className="text-[10px] font-semibold">Dashboard</span>
            </button>

            <button 
              onClick={() => { triggerHaptic(); setActiveTab('operations'); }}
              className={`flex flex-col items-center gap-1 ${activeTab === 'operations' ? 'text-blue-500' : 'text-slate-500'}`}
            >
              <i data-lucide="truck" class="h-5 w-5"></i>
              <span className="text-[10px] font-semibold">Operations</span>
            </button>

            <button 
              onClick={() => { triggerHaptic(); setActiveTab('accounts'); }}
              className={`flex flex-col items-center gap-1 ${activeTab === 'accounts' ? 'text-blue-500' : 'text-slate-500'}`}
            >
              <i data-lucide="credit-card" class="h-5 w-5"></i>
              <span className="text-[10px] font-semibold">Accounts</span>
            </button>
          </nav>

          {/* ADD / EDIT TRANSPORT OPERATION MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center">
              <div className="bg-slate-900 border-t border-slate-800 rounded-t-3xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">
                    {editingOp ? 'Edit Transport Job' : 'Dispatch New Transport'}
                  </h3>
                  <button 
                    onClick={() => setIsModalOpen(false)}
                    className="p-1 bg-slate-800 rounded-full text-slate-400"
                  >
                    <i data-lucide="x" class="h-4 w-4"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveOperation} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Driver Name</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Abebe Bikila"
                      value={formData.driver}
                      onChange={e => setFormData({...formData, driver: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">Truck Plate No.</label>
                      <input 
                        type="text" 
                        required
                        placeholder="3-ET-XXXXX"
                        value={formData.plateNo}
                        onChange={e => setFormData({...formData, plateNo: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">Status</label>
                      <select 
                        value={formData.status}
                        onChange={e => setFormData({...formData, status: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                      >
                        <option value="IN_TRANSIT">In Transit</option>
                        <option value="CUSTOMS_HOLD">Customs Hold</option>
                        <option value="DELIVERED">Delivered</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Cargo Description</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Fertilizer (30 MT)"
                      value={formData.cargo}
                      onChange={e => setFormData({...formData, cargo: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">Current Checkpoint</label>
                      <input 
                        type="text" 
                        value={formData.checkpoint}
                        onChange={e => setFormData({...formData, checkpoint: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">Associated CBE Account</label>
                      <select 
                        value={formData.creditAccount}
                        onChange={e => setFormData({...formData, creditAccount: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-mono focus:outline-none focus:border-blue-500"
                      >
                        {accounts.map(a => (
                          <option key={a.id} value={a.creditAccount}>{a.creditAccount}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <button 
                    type="submit" 
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-blue-600/30 mt-2"
                  >
                    Save & Sync Job
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BafsTelegramMiniApp />);
  </script>
</body>
</html>
